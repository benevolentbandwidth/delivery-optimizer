runConfig:
  runtime: nodejs20
  memoryMiB: 512
  concurrency: 100
  minInstances: 0
  maxInstances: 4

env:
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_KEY
    secret: GOOGLE_MAPS_KEY
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
    secret: GOOGLE_MAPS_MAP_ID
  - variable: DELIVERYOPTIMIZER_API_URL
    secret: DELIVERYOPTIMIZER_API_URL
    availability:
      - BUILD
      - RUNTIME
  # WhatsApp Cloud API. Routes are sent from this runtime, so the token lives
  # here rather than on the C++ service. Both secrets must be granted to the
  # App Hosting service account before a rollout will succeed.
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: WHATSAPP_ACCESS_TOKEN
    availability:
      - RUNTIME
  - variable: WHATSAPP_PHONE_NUMBER_ID
    secret: WHATSAPP_PHONE_NUMBER_ID
    availability:
      - RUNTIME
  # Approved template that carries the route PDF as its document header.
  - variable: WHATSAPP_ROUTE_TEMPLATE_NAME
    value: driver_route_document
  - variable: WHATSAPP_ROUTE_TEMPLATE_LANGUAGE
    value: en_US
  - variable: FEEDBACK_ENABLED
    value: "1"
  - variable: FEEDBACK_GITHUB_REPO
    secret: FEEDBACK_GITHUB_REPO
  - variable: FEEDBACK_GITHUB_APP_ID
    secret: FEEDBACK_GITHUB_APP_ID
  - variable: FEEDBACK_GITHUB_INSTALLATION_ID
    secret: FEEDBACK_GITHUB_INSTALLATION_ID
  - variable: FEEDBACK_GITHUB_PRIVATE_KEY
    secret: FEEDBACK_GITHUB_PRIVATE_KEY
  - variable: FEEDBACK_SCREENSHOT_BUCKET
    secret: FEEDBACK_SCREENSHOT_BUCKET
  # reCAPTCHA is optional and OFF by default. The server disables verification
  # when FEEDBACK_RECAPTCHA_SECRET is unset (see lib/feedback/security.ts).
  # To enable: create reCAPTCHA v3 keys, put them in the FEEDBACK_RECAPTCHA_SITE_KEY
  # and FEEDBACK_RECAPTCHA_SECRET secrets, then re-add:
  #   - variable: NEXT_PUBLIC_FEEDBACK_RECAPTCHA_SITE_KEY
  #     secret: FEEDBACK_RECAPTCHA_SITE_KEY
  #     availability: [BUILD, RUNTIME]
  #   - variable: FEEDBACK_RECAPTCHA_SECRET
  #     secret: FEEDBACK_RECAPTCHA_SECRET
  #   - variable: FEEDBACK_RECAPTCHA_MIN_SCORE
  #     value: "0.5"
  # Do NOT map these to placeholder secrets — every submission would fail with 403.
  - variable: FEEDBACK_RATE_LIMIT_WINDOW_MS
    value: "600000"
  - variable: FEEDBACK_RATE_LIMIT_MAX
    value: "5"
  - variable: FEEDBACK_DAILY_SHUTDOWN_THRESHOLD
    value: "100"
